name: Build Android app (check)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-source/**", "tailnet-helper/**", ".github/workflows/build-android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build the phone's private-network helper
        working-directory: tailnet-helper
        run: |
          go mod tidy
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/libsatailnet.so" .
      - name: Build the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; export KEYSTORE="$RUNNER_TEMP/release.keystore"; fi
          HELPER="$RUNNER_TEMP/libsatailnet.so" bash android-source/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ServerAssistant-apk
          path: android-source/ServerAssistant.apk
