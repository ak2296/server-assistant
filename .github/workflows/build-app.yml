name: Publish app update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "run.py", "tray.py", "appwindow.py", "fix-downloader.ps1", "requirements*.txt", "config.example.toml", "README.md", "VERSION", "installer/**", "android-source/**", "tailnet-helper/**"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build the phone's private-network helper
        working-directory: tailnet-helper
        run: |
          go mod tidy
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/libsatailnet.so" .
      - name: Build the Android app (needs the signing key secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No ANDROID_KEYSTORE_B64 secret: keeping the APK that is already in the repository"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          HELPER="$RUNNER_TEMP/libsatailnet.so" KEYSTORE="$RUNNER_TEMP/release.keystore" bash android-source/build-ci.sh
      - name: Build the update zip
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          mkdir -p ServerAssistant
          cp -r app run.py tray.py appwindow.py fix-downloader.ps1 requirements.txt requirements-optional.txt config.example.toml README.md VERSION ServerAssistant/
          find ServerAssistant -name __pycache__ -prune -exec rm -rf {} +
          zip -qr ServerAssistant.zip ServerAssistant
          cp start.bat ServerAssistant/
          zip -qr ServerAssistant-Portable.zip ServerAssistant
          rm ServerAssistant/start.bat
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Build the installers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          bash installer/build.sh
          cp ../ServerAssistant-Setup.exe ../ServerAssistant-Viewer-Setup.exe .
          mkdir ServerAssistant-Viewer
          cp installer/viewer/viewer.ps1 installer/viewer/favicon.ico installer/viewer/Install-Viewer.bat installer/viewer/Install-Viewer.ps1 ServerAssistant-Viewer/
          sed -i 's/$/\r/' ServerAssistant-Viewer/Install-Viewer.bat
          zip -qr ServerAssistant-Viewer.zip ServerAssistant-Viewer
      - name: Publish as the newest version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: v${{ env.VER }}
          make_latest: false
          files: |
            ServerAssistant.zip
            ServerAssistant-Portable.zip
            ServerAssistant-Setup.exe
            ServerAssistant-Viewer-Setup.exe
            ServerAssistant-Viewer.zip
            android-source/ServerAssistant.apk
