<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Server Assistant</title>
<style>
  :root { --bg:#1f2326; --card:#282a2d; --card2:#33363a; --line:#3d4146; --text:#ececec; --muted:#a3a8ad; --accent:#e5a00d; --on-accent:#1b1300; --good:#6fcf97; --bad:#f26b4e; --blue:#6aa9dc; --rail:232px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; padding-bottom:108px; }
  header { padding:20px 16px 4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { font-size:26px; margin:0; font-weight:700; }
  h2 { font-size:18px; margin:22px 2px 10px; font-weight:700; color:var(--text); }
  .sub { color:var(--muted); font-size:14px; padding:0 16px 10px; }
  .warn { color:var(--accent); } .ok { color:var(--good); } .fail { color:var(--bad); } .muted { color:var(--muted); }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 16px; min-height:40px; cursor:pointer; color:var(--text); background:var(--card2); }
  button:hover { background:#3b3f44; }
  button.primary { background:var(--accent); color:var(--on-accent); }
  button.primary:hover { background:#f0b429; }
  button.small { padding:6px 12px; min-height:36px; font-size:14px; }
  button.danger { background:transparent; color:var(--bad); box-shadow:inset 0 0 0 1px var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  textarea, input[type=text] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:14px; }
  textarea { min-height:64px; resize:vertical; }
  input[type=file] { color:var(--muted); font-size:13px; max-width:100%; }
  main { padding:0 14px; }
  .stack { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border-radius:16px; padding:14px; }
  .row { display:flex; gap:14px; align-items:flex-start; }
  .cover { width:84px; height:84px; border-radius:10px; background:var(--card2) center/cover no-repeat; flex-shrink:0; position:relative; }
  .srctag { position:absolute; left:6px; bottom:6px; font-size:11px; font-weight:600; background:rgba(0,0,0,.55); color:#fff; border-radius:6px; padding:2px 7px; }
  .poster { width:72px; height:108px; border-radius:10px; background:var(--card2) center/cover no-repeat; flex-shrink:0; }
  .grow { flex:1; min-width:0; }
  .small-t { color:var(--muted); font-size:14px; }
  .title { font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:13px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .actions a { color:var(--muted); font-size:13px; text-decoration:underline; padding:8px 4px; }
  .actions a:hover { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; padding:34px 20px; }
  .chips { display:flex; gap:8px; padding:0 2px 12px; flex-wrap:wrap; }
  .chip { background:var(--card2); color:var(--text); border-radius:20px; padding:8px 16px; font-size:14px; min-height:40px; }
  .chip.on { background:var(--accent); color:var(--on-accent); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:var(--accent); border-radius:4px; }
  .bar.blue > div { background:var(--blue); } .bar.hot > div { background:var(--bad); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat .big { font-size:24px; font-weight:700; }
  .spark { width:100%; height:34px; display:block; margin-top:8px; }
  .kv { display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:4px 0; }
  .kv span:first-child { color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .pill { display:inline-block; font-size:12px; padding:3px 8px; border-radius:8px; background:var(--card2); color:var(--muted); margin:3px 4px 0 0; }
  .pill.t { background:#3d3112; color:var(--accent); }
  .rail { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 2px 10px; margin:0 -2px; scrollbar-width:thin; overscroll-behavior-x:contain; }
  .rail > div { flex:0 0 118px; scroll-snap-align:start; min-width:0; }
  .rail .poster, .rail .sq { width:118px; background:var(--card2) center/cover no-repeat; border-radius:10px; display:block; object-fit:cover; }
  .rail .poster { height:177px; } .rail .sq { height:118px; }
  .rail .cap { font-size:13px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .railwrap { position:relative; } .railwrap .nx, .railwrap .pv { display:none; }
  @media (hover:hover) and (min-width:900px) { .railwrap .nx, .railwrap .pv { display:grid; place-items:center; position:absolute; top:60px; width:36px; height:36px; min-height:0; padding:0; border-radius:50%; background:rgba(31,35,38,.92); box-shadow:0 0 0 1px var(--line); z-index:2; } .railwrap .pv { left:-12px; } .railwrap .nx { right:-12px; } }
  .recent { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:12px; }
  .recent .poster { width:100%; height:auto; aspect-ratio:2/3; }
  .recent .cap { font-size:13px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addbox { margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .toggle { display:flex; gap:8px; }
  .log .path { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .badge { background:var(--accent); color:var(--on-accent); border-radius:10px; padding:1px 8px; font-size:12px; margin-left:auto; font-weight:700; }
  .field { margin-bottom:16px; }
  .settings-grid > .card, .settings-grid > details.fold { margin-bottom:12px; }
  .field label.l { display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  .hint { font-size:13px; color:var(--muted); margin-top:6px; }
  [hidden] { display:none !important; }
  /* collapsible sections */
  details.fold { background:var(--card); border-radius:16px; margin:0 0 12px; }
  details.fold > summary { list-style:none; cursor:pointer; padding:12px 16px; min-height:52px; display:flex; align-items:center; gap:12px; font-weight:700; font-size:16px; border-radius:16px; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:""; width:8px; height:8px; flex-shrink:0; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; }
  details.fold[open] > summary::before { transform:rotate(45deg); }
  details.fold > summary:hover { background:var(--card2); }
  details.fold > summary:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  details.fold .m { margin-left:auto; font-weight:400; font-size:13px; color:var(--muted); }
  details.fold .fbody { padding:0 16px 16px; }
  #view > details.fold, #settingsForm > details.fold { margin-top:12px; }
  .savebar { position:sticky; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:4; padding:14px 0 8px; background:linear-gradient(rgba(31,35,38,0), var(--bg) 45%); }
  @media (prefers-reduced-motion: reduce) { details.fold > summary::before { transition:none; } .check input[type=checkbox], .check input[type=checkbox]::before { transition:none !important; } }
  /* settings sections: icon, one-line summary, status pill */
  details.fold.sec > summary { min-height:60px; }
  .sec .ico { width:36px; height:36px; border-radius:10px; background:var(--card2); display:grid; place-items:center; color:var(--accent); flex-shrink:0; }
  .sec[open] .ico { background:#3d3112; }
  .sec .ico svg { width:20px; height:20px; }
  .sec .st { flex:1; min-width:0; } .sec .st b { display:block; font-size:16px; } .sec .st span { display:block; color:var(--muted); font-size:13px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sec .pill2 { font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--card2); color:var(--muted); flex-shrink:0; }
  .sec .pill2.ok { background:#1d3a2a; color:var(--good); } .sec .pill2.warn { background:#3d3112; color:var(--accent); }
  .sec > summary::before { order:9; margin-right:4px; }
  .sec > summary .st { order:1; } .sec > summary .ico { order:0; } .sec > summary .pill2 { order:2; }
  /* tick boxes become switches, shown as rows */
  .check:has(> input[type=checkbox]) { justify-content:space-between; flex-direction:row-reverse; padding:10px 0; margin:0; border-bottom:1px solid var(--line); min-height:48px; }
  .check:has(> input[type=checkbox]):last-child { border-bottom:0; }
  .check input[type=checkbox] { appearance:none; -webkit-appearance:none; width:46px; height:28px; border-radius:14px; background:var(--line); position:relative; flex-shrink:0; cursor:pointer; margin:0; transition:background .15s; }
  .check input[type=checkbox]::before { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; }
  .check input[type=checkbox]:checked { background:var(--accent); }
  .check input[type=checkbox]:checked::before { transform:translateX(18px); background:var(--on-accent); }
  .check input[type=checkbox]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .folderlist, .fbody .field:has(> .check) { background:var(--bg); border-radius:12px; padding:2px 12px; }
  .folderlist .check { padding:10px 0; }
  .fbody .seg { background:var(--bg); border-radius:12px; padding:4px; gap:4px; flex-wrap:nowrap; }
  .fbody .seg > label { flex:1; justify-content:center; text-align:center; border-radius:9px; min-height:40px; font-size:14px; font-weight:600; cursor:pointer; background:transparent; color:var(--muted); border-bottom:0 !important; margin:0; padding:8px 6px; }
  .fbody .seg > label.on, .fbody .seg > label:has(input[type=radio]:checked) { background:var(--card2); color:var(--text); box-shadow:inset 0 0 0 1px var(--accent); }
  .fbody .seg > label.check { flex-direction:row; gap:6px; }
  .fbody .seg input[type=radio] { accent-color:var(--accent); }
  .fbody .field > label.l { font-weight:600; color:var(--text); }
  .fbody input[type=text] { min-height:44px; padding:0 12px; } .fbody input[type=text]:focus { border-color:var(--accent); outline:0; }
  .fbody .actions button.small { min-height:40px; }
  .fbody .actions button.small:not(.primary) { background:transparent; box-shadow:inset 0 0 0 1px var(--line); } .fbody .actions button.small:not(.primary):hover { background:var(--card2); }
  .check { display:flex; gap:10px; align-items:center; font-size:15px; margin-bottom:10px; min-height:32px; }
  .check input { width:20px; height:20px; accent-color:var(--accent); }
  .seg { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .folderlist { font-size:14px; background:var(--bg); border-radius:10px; padding:10px 12px; overflow-wrap:anywhere; }
  .folderlist div { padding:2px 0; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .overlay .sheet { background:var(--card); width:100%; max-width:640px; max-height:80vh; border-radius:18px 18px 0 0; padding:16px; display:flex; flex-direction:column; }
  .overlay .items { overflow:auto; flex:1; margin:8px 0; }
  .overlay .items button { display:block; width:100%; text-align:left; background:none; border-bottom:1px solid var(--line); border-radius:0; padding:12px 6px; overflow-wrap:anywhere; }
  .ministatus { position:fixed; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:5; text-align:center; font-size:12px; color:var(--muted); background:var(--card); padding:3px 8px; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toast { position:fixed; left:12px; right:12px; bottom:116px; background:var(--card2); border:1px solid var(--line); padding:12px 16px; border-radius:12px; font-size:14px; z-index:30; }
  /* navigation: bottom bar on phones, left rail on wide screens */
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding:4px 4px calc(8px + env(safe-area-inset-bottom)); z-index:5; }
  nav .brand, nav .railstatus { display:none; }
  nav button { flex:1; background:none; border-radius:10px; padding:6px 2px; min-height:56px; color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative; }
  nav button:hover { background:none; color:var(--text); }
  nav button.on { color:var(--accent); }
  nav button svg { width:22px; height:22px; }
  nav button .badge { position:absolute; top:2px; left:calc(50% + 6px); margin:0; font-size:11px; padding:0 6px; }
  @media (min-width: 900px) {
    body { padding-bottom:40px; padding-left:var(--rail); }
    nav { top:0; bottom:0; right:auto; width:var(--rail); flex-direction:column; gap:6px; padding:22px 14px 18px; border-top:0; background:var(--card); }
    nav .brand { display:flex; align-items:center; gap:10px; padding:0 8px 18px; font-weight:700; font-size:16px; }
    nav .brand b { width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:15px; }
    nav button { flex:none; flex-direction:row; justify-content:flex-start; gap:12px; min-height:44px; padding:0 14px; font-size:15px; }
    nav button:hover { background:var(--card2); }
    nav button.on { background:var(--card2); }
    nav button .badge { position:static; margin-left:auto; }
    .ministatus { display:none; }
    nav .railstatus { display:block; margin-top:auto; background:var(--bg); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; color:var(--muted); }
    header, .sub, main { max-width:1120px; margin-left:auto; margin-right:auto; }
    header { padding:30px 40px 6px; } .sub { padding:0 40px 12px; } main { padding:0 40px; }
    h1 { font-size:30px; }
    .grid2 { grid-template-columns:repeat(4, 1fr); }
    .stack.cols { display:grid; grid-template-columns:1fr 1fr; }
    .recent { grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); }
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
    .settings-grid > .card, .settings-grid > details.fold { margin-bottom:0; }
    .savebar { bottom:0; }
    .overlay { align-items:center; } .overlay .sheet { border-radius:18px; }
    .toast { left:auto; right:24px; bottom:24px; width:360px; }
    /* release tiles: big covers in a grid */
    .relgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
    .rel .row { flex-direction:column; gap:10px; }
    .rel .cover { width:100%; height:auto; aspect-ratio:1/1; }
    .rel.open { grid-column:span 2; }
    .poster.big { width:104px; height:156px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="heading">Server</h1>
  <div style="display:flex;gap:6px"><button class="small" id="actionBtn" hidden></button><button class="small" id="appGear" hidden title="Change server">⚙</button></div>
</header>
<div class="sub" id="sub"></div>
<main id="view"></main>
<div class="ministatus" id="miniStatus"></div>
<div class="toast" id="toast" hidden></div>

<nav aria-label="Main">
  <div class="brand"><b>SA</b>Server Assistant</div>
  <button data-tab="server" class="on"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg><span>Server</span></button>
  <button data-tab="music"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>Music</span><span class="badge" id="newCount" hidden></span></button>
  <button data-tab="downloads"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span>Downloads</span><span class="badge" id="dlCount" hidden></span></button>
  <button data-tab="subs"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h4M13 10h4M7 14h6"/></svg><span>Subtitles</span></button>
  <button data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
  <div class="railstatus" id="railStatus">Server Assistant</div>
</nav>
<div id="picker" class="overlay" hidden></div>

<script>
let showUnmatched = false;
let tab = "server", musicFilter = "new", openAdd = null, confirmStop = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (p, opt) => { let r; for (let i = 0; ; i++) { try { r = await fetch(p, opt); break; } catch (e) { if (i >= 2 || (opt && opt.method && opt.method !== "GET")) throw e; await new Promise(x => setTimeout(x, 600 * (i + 1))); } } const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || r.statusText); return j; };
let histTab = "video", appVer = "", plexOnline = null, plexUp = 0;
function paintStatus() {  // the version line in the menu: shown on every page
  if (!appVer) return;
  const plex = plexOnline === null ? "" : plexOnline ? `<span class="ok">●</span> Plex is running${plexUp ? "<br>Up " + dur(plexUp) : ""}<br>` : `<span class="fail">●</span> Plex is not responding<br>`;
  $("#railStatus").innerHTML = plex + `Server Assistant v${esc(appVer)}`;
  $("#miniStatus").innerHTML = (plexOnline === null ? "" : (plexOnline ? '<span class="ok">●</span> Plex running' : '<span class="fail">●</span> Plex not responding') + " · ") + `Server Assistant v${esc(appVer)}`;
}
let loadedVer = "";
const loadVersion = () => fetch("/api/version").then(r => r.json()).then(v => {
  if (!loadedVer) loadedVer = v.version;
  else if (v.version !== loadedVer && !document.getElementById("settingsForm")) { location.reload(); return; }  // the server was updated: show the new screens (not while editing Settings)
  appVer = v.version; paintStatus();
}).catch(() => {});
loadVersion(); setInterval(loadVersion, 60000);
const foldState = (() => { try { return JSON.parse(sessionStorage.getItem("folds") || "{}"); } catch (e) { return {}; } })();
const isOpen = (id, def = false) => id in foldState ? foldState[id] : def;
document.addEventListener("toggle", e => { const d = e.target; if (d.classList && d.classList.contains("fold") && d.dataset.f) { foldState[d.dataset.f] = d.open; try { sessionStorage.setItem("folds", JSON.stringify(foldState)); } catch (x) {} } }, true);
const fold = (id, title, body, meta = "", def = false) => `<details class="fold" data-f="${id}" ${isOpen(id, def) ? "open" : ""}><summary><span>${title}</span>${meta ? `<span class="m">${meta}</span>` : ""}</summary><div class="fbody">${body}</div></details>`;
const ICO = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function secInfo(t) {  // icon, one-line summary and status pill for each Settings section
  const S = settings; if (!S) return null;
  const on = (b, yes = "On", no = "Off") => [b ? yes : no, b ? "ok" : "warn"];
  const n = (info, list) => info.mode === "auto" ? `Automatic from Plex${list.length ? ` · ${list.length - (info.exclude || []).length} of ${list.length} folders` : ""}` : "Folders you chose";
  const m = {
    "Music folders": [ICO('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'), n(S.music, S.plex_folders.artist)],
    "Movie folders (for subtitles)": [ICO('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>'), n(S.movies, S.plex_folders.movie)],
    "Music downloads": [ICO('<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>'), `${S.music.sources.length} sources · last ${S.music.lookback_days} days · ${S.music.release_types.join(", ")}`],
    "Downloads": [ICO('<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>'), S.qbittorrent.engine === "qbittorrent" ? "qBittorrent" : "Built-in downloader"],
    "Subtitles": [ICO('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h4M13 10h4M7 14h6"/>'), S.subtitles.languages.join(", "), on(S.subtitles.enabled)],

async function skipArtist(name) {
  await api("/api/skipped-artists", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({artist:name})});
  toast(`${name} skipped. Remove them under Music → Skipped to bring them back.`); render();
}
async function unskipArtist(name) {
  await api("/api/skipped-artists/" + encodeURIComponent(name), {method:"DELETE"});
  toast(`${name} is back on the list.`); render();
}
async function setStatus(mbid, status) {
  await api(`/api/releases/${mbid}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status})});
  render();
}
async function renderMusic() {
  const my = seq;
  $("#heading").textContent = "Music";
  const btn = $("#actionBtn"); btn.hidden = false; btn.textContent = "Check now";
  btn.onclick = async () => { await api("/api/check-releases", {method:"POST"}); toast("Checking for new releases…"); setTimeout(render, 1500); };
  const [st, rows, skippedArtists] = await Promise.all([api("/api/status"), api(`/api/releases?status=${musicFilter === "upcoming" ? "new&when=upcoming" : musicFilter}`), api("/api/skipped-artists")]);
  const rc = st.release_check;
  let sub = st.library_found ? `${st.artists} artists in your library` : `<span class="warn">No music folder found. Check Settings → Music folders.</span>`;
  if (rc.running) sub += ` · checking ${rc.done}/${rc.total}${rc.current ? " (" + esc(rc.current) + ")" : ""}…`;
  else if (rc.last_run) sub += ` · last check ${esc(rc.last_run)}`;
  const un = st.unmatched_artists;  // hidden by default; one tap shows the list
  if (un.length) sub += ` · <a href="#" class="muted" onclick="showUnmatched = !showUnmatched; render(); return false">${un.length} not matched ${showUnmatched ? "▲" : "▼"}</a>`
    + (showUnmatched ? `<br><span class="muted">No match on any music source for: ${un.map(esc).join(", ")}</span>` : "");
  setSub(my, sub);
  const chips = [["new", "New"], ["upcoming", "Upcoming"], ["wanted", "Later"], ["gap", "Missing albums"], ["skipped", "Skipped"]]
    .map(([k, l]) => `<button class="chip ${musicFilter === k ? "on" : ""}" onclick="musicFilter='${k}';openAdd=null;render()">${l}${(k === "new" || k === "gap" || k === "upcoming") && st.release_counts[k] ? " " + st.release_counts[k] : ""}</button>`).join("");
  const empty = {new:"No new releases right now.", wanted:"Nothing saved for later.", skipped:"Nothing skipped.", upcoming:"No announced albums from your artists yet.", gap:"No missing albums found. Turn this on in Settings → Music."}[musicFilter];
  const skippedBox = musicFilter === "skipped" && skippedArtists.length
    ? `<h2>Skipped artists</h2><div class="stack"><div class="card"><div class="hint" style="margin-bottom:6px">These artists are not checked for new releases.</div>${skippedArtists.map(a =>
        `<div class="row" style="justify-content:space-between;gap:8px;padding:4px 0"><span>${esc(a)}</span><button class="small" data-a="${esc(a)}" onclick="unskipArtist(this.dataset.a)">Remove</button></div>`).join("")}</div></div><h2>Skipped releases</h2>` : "";
  setView(my, `<div class="chips">${chips}</div>${skippedBox}<div class="stack relgrid">${rows.length ? rows.map(releaseCard).join("") : `<div class="empty">${empty}</div>`}</div>`);
}

async function renderDownloads() {
  const my = seq;
  $("#heading").textContent = "Downloads";
  $("#actionBtn").hidden = true;
  const [dl, sorted] = await Promise.all([api("/api/downloads"), api("/api/sorted?limit=30")]);
  setSub(my, dl.enabled ? (dl.error ? `<span class="fail">Downloader: ${esc(dl.error)}</span>` : "Finished torrents stop right away (no seeding). Music is moved into your library.")
    : `<span class="warn">Downloading is switched off. Turn it on in Settings.</span>`);
  let h = "";
  if (dl.error && /libtorrent/.test(dl.error)) h += `<div class="card" style="margin-bottom:12px"><div class="title" style="font-size:15px">The built-in downloader can't start</div>
    <div class="hint" style="margin:6px 0 10px">It needs Python 3.13 (3.14 is too new for it). Repair installs Python 3.13 for your user only, without changing your own Python, rebuilds the app on it and restarts the app. It takes a few minutes and needs internet. Your settings are kept.</div>
    <div class="actions"><button class="small primary" onclick="fixDownloader()">Repair the downloader</button></div></div>`;
  const ts = dl.torrents || [];
  if (ts.length) h += `<h2>Downloading</h2><div class="stack">${ts.map(t => `<div class="card">
      <div class="title" style="font-size:14px">${esc(t.name)}</div>
      <div class="bar ${t.music ? "" : "blue"}"><div style="width:${t.progress.toFixed(1)}%"></div></div>
      <div class="meta" style="display:flex;justify-content:space-between;margin-top:4px;gap:8px">
        <span>${t.progress.toFixed(0)}%${t.size ? " of " + bytes(t.size) : ""} · ${esc(({metaDL:"finding the download", downloading:"downloading", checkingDL:"checking files", checkingResumeData:"checking files", uploading:"finishing", error:"error"})[t.state] || t.state)}${t.dlspeed ? " · ↓ " + rate(t.dlspeed) : ""}${t.eta && t.eta < 8640000 ? " · " + dur(t.eta) + " left" : ""}${t.music ? " · music" : ""}</span>
        <button class="small danger" onclick="cancelDl('${t.hash}')">Cancel</button></div></div>`).join("")}</div>`;
  h += `<h2>Recently sorted</h2><div class="stack">${sorted.length ? sorted.map(r => `<div class="card log">
      <div class="${r.ok ? "ok" : "fail"}">${r.ok ? "✓" : "✗"} ${esc(r.message)}</div>
      <div class="path">${r.dest ? "→ " + esc(r.dest) : esc(r.source)}</div><div class="meta">${esc(r.at.replace("T", " "))}</div></div>`).join("")
    : `<div class="empty">Nothing sorted yet.</div>`}</div>`;
  // build the add form once, then only refresh the lists (so typing/picking a file isn't wiped)
  if (my !== seq) return;
  if (!$("#dlRest")) $("#view").innerHTML = (dl.enabled ? `<div class="card" id="addForm"><div class="title" style="font-size:15px">Add a download</div>${addBox("", "", true)}</div>` : "") + `<div id="dlRest"></div>`;
  $("#dlRest").innerHTML = h;
  const n = ts.length; $("#dlCount").hidden = !n; $("#dlCount").textContent = n;
}
async function cancelDl(hash) { await api(`/api/downloads/${hash}`, {method:"DELETE"}); toast("Download cancelled"); render(); }

/* ---------------- SUBTITLES ---------------- */
function pickSub(key, lang) {  // attach a subtitle file whose name doesn't match the movie
  const i = document.createElement("input"); i.type = "file"; i.accept = ".srt,.ass,.ssa,.vtt,.sub";
  i.onchange = async () => {
    if (!i.files[0]) return;
    const f = new FormData(); f.append("key", key); f.append("lang", lang); f.append("file", i.files[0]);
    toast("Adding subtitle…");
    try { const r = await api("/api/library/add-subtitle", {method:"POST", body:f}); toast(`Saved as ${r.saved}` + (r.plex_rescan ? "" : " (Plex will see it at its next scan)")); render(); }
    catch (e) { toast(e.message); }
  };
  i.click();
}
async function renderSubs() {
  const my = seq;
  $("#heading").textContent = "Subtitles";
  const btn = $("#actionBtn"); btn.hidden = false; btn.textContent = "Check now";
  btn.onclick = async () => { await api("/api/check-subtitles", {method:"POST"}); toast("Looking for missing subtitles…"); };
  const [st, rows, gaps] = await Promise.all([api("/api/status"), api("/api/subtitles"), api("/api/library/subtitle-gaps").catch(() => null)]);
  const s = st.subtitles;
  const gapBox = gaps && gaps.total ? `<h2>Missing in Plex <span class="muted" style="font-weight:400">${gaps.missing.length} of ${gaps.total} movies</span></h2>
    <div class="card"><div class="actions" style="margin:0 0 6px"><button class="small" onclick="api('/api/library/scan-subtitles',{method:'POST'}).then(()=>{toast('Scanning Plex…');setTimeout(render,2500)})">${gaps.progress.running ? "Scanning " + gaps.progress.done + "/" + gaps.progress.total : "Rescan"}</button></div>
      ${gaps.missing.length ? gaps.missing.slice(0, 60).map(g => `<div class="kv" style="padding:4px 0;gap:10px"><span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.title)}${g.year ? " (" + g.year + ")" : ""}</span><span style="white-space:nowrap">needs ${esc(g.missing.join(", "))}</span><button class="small" onclick="pickSub('${esc(g.key)}','${esc(g.missing[0])}')">Add file</button></div>`).join("") + (gaps.missing.length > 60 ? `<div class="hint">+${gaps.missing.length - 60} more</div>` : "") : `<div class="ok">Every movie has the languages you want.</div>`}</div><h2>Activity</h2>` : "";
  setSub(my, !s.enabled ? `<span class="warn">Subtitles are off. Turn them on in Settings.</span>`
    : s.running ? "Searching…" : s.last_run ? `Last check ${esc(s.last_run)} · ${s.last_count} downloaded` : "");
  const label = {downloaded:"✓ Downloaded", not_found:"– None found yet", error:"✗ Error"};
  if (my !== seq) return;
  $("#view").innerHTML = `${gapBox}<div class="stack">${rows.length ? rows.map(r => `<div class="card log">
      <div class="${r.status === "downloaded" ? "ok" : r.status === "error" ? "fail" : ""}">${label[r.status] || esc(r.status)} · ${esc(r.language)}</div>
      <div class="path">${esc(r.video.split(/[\\/]/).pop())}</div><div class="meta">${esc(r.at.replace("T", " "))} ${esc(r.message)}</div></div>`).join("")
    : `<div class="empty">No subtitle activity yet.</div>`}</div>`;
}

  api("/api/backup").then(b => { const e = $("#bkInfo"); if (e) e.innerHTML = !b.found ? "Plex's database wasn't found on this PC."
    : `One backup is about <b>${bytes(b.estimate)}</b>.` + (b.last ? ` Last: ${esc(b.last)} (${bytes(b.last_size)}), ${b.copies} kept.` : " No backup yet."); }).catch(() => {});
  api("/api/version").then(v => { const e = $("#verLine"); if (e) e.innerHTML = `Version <b>${esc(v.version)}</b>${v.installed ? " · installed with Setup" : ""}<br>${v.auto ? (v.update.at ? `Last check ${esc(v.update.at)}: ${v.update.error ? `<span class="fail">${esc(v.update.error)}</span>` : esc(v.update.result)}` : "Auto-update starts a minute after the program starts.") : "Auto-update is off."}<br>Your settings are in ${esc(v.data_folder)}`; }).catch(() => {});
}
function tailnetText(t) {
  if (!t.enabled) return "Off.";
  if (!t.installed) return "The helper isn't downloaded yet. Press Download helper.";
  if (t.state === "login") return `Sign in to Tailscale once: <a href="${esc(t.url)}" target="_blank" rel="noopener">open the sign-in page</a>`;
  if (t.state === "up") return t.mode === "serve" ? `Connected. Away from home, open <b>http://${esc(t.name)}:8765</b> (or http://${esc(t.ip)}:8765) on a device with Tailscale.`
    : `Connected. Open <b>http://127.0.0.1:8766</b> on this PC to reach the server.`;
  if (t.state === "error") return `<span class="fail">${esc(t.error || "Something went wrong.")}</span>`;
  return "Starting…";
}
async function tailnetRefresh(n = 0) { const e = $("#tnInfo"); if (!e) return; try { const t = await api("/api/tailnet"); e.innerHTML = tailnetText(t); if (n < 40 && t.enabled && t.state !== "up" && t.state !== "error") setTimeout(() => tailnetRefresh(n + 1), 2000); } catch (x) {} }
async function tailnetInstall() { toast("Downloading…"); try { await api("/api/tailnet/install", {method:"POST"}); toast("Helper installed"); } catch (e) { toast(e.message); } tailnetRefresh(); }
async function tailnetRestart() { await api("/api/tailnet/restart", {method:"POST"}); tailnetRefresh(); }
async function backupNow() {
  toast("Backing up…");
  try { const r = await api("/api/backup/run", {method:"POST"}); toast(`Backup done: ${bytes(r.size)}`); const b = await api("/api/backup"); const e = $("#bkInfo"); if (e) e.innerHTML = `Last: ${esc(b.last)} (${bytes(b.last_size)}), ${b.copies} kept.`; }
  catch (e) { toast(e.message); }
}
async function checkUpdates() {
  const e = $("#updInfo"); e.textContent = "Checking GitHub…";
  try { const u = await api("/api/updates/check"); e.innerHTML = u.available ? `Version <b>${esc(u.version)}</b> is available (you have ${esc(u.current)}).` : `You are up to date (${esc(u.current)}).`; $("#updInstall").hidden = !u.available; }
  catch (x) { e.innerHTML = `<span class="fail">${esc(x.message)}</span>`; }
}
async function installUpdates() {
  toast("Updating…");
  try { const r = await api("/api/updates/install", {method:"POST"}); if (!r.updated) { toast("Already up to date"); return; } toast(`Updated to ${r.version}. Restarting…`); }
  catch (x) { toast(x.message); return; }
  for (let i = 0; i < 60; i++) { await new Promise(r => setTimeout(r, 1500)); try { const r = await fetch("/api/ping", {cache:"no-store"}); if (r.ok && i > 1) { location.reload(); return; } } catch (x) {} }
}
async function doUpdate() {
  const f = $("#updFile").files[0];
  if (!f) { toast("Choose the update .zip first."); return; }
  const fd = new FormData(); fd.append("file", f);
  toast("Updating…");
  try { const r = await api("/api/update", {method:"POST", body:fd}); toast(`Updated to ${r.version}. Restarting…`); }
  catch (e) { toast(e.message); return; }
  for (let i = 0; i < 60; i++) {  // wait for the server to come back, then reload
    await new Promise(r => setTimeout(r, 1500));
    try { const r = await fetch("/api/ping", {cache:"no-store"}); if (r.ok && i > 1) { location.reload(); return; } } catch (e) {}
  }
}
async function saveSettings(ev) {
  ev.preventDefault();
  collectSources();
  try { await api("/api/subsources", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({sources: srcList})}); }
  catch (e) { toast(e.message); return; }
  const mode = k => document.querySelector(`input[name=${k}Mode]:checked`).value;
  const body = {
    music: { mode: mode("music"), custom: val("musicFolders").value, download_folders: val("dlFolders").value,
             exclude: [...document.querySelectorAll(".exc-music:not(:checked)")].map(x => x.value), lookback_days: val("lookback").value, catalog_gaps: val("catGaps").checked, sources: [...document.querySelectorAll(".msrc:checked")].map(x => x.value), release_types: [...document.querySelectorAll(".rtype:checked")].map(x => x.value) },
    movies: { mode: mode("movies"), custom: val("moviesFolders").value, exclude: [...document.querySelectorAll(".exc-movies:not(:checked)")].map(x => x.value) },
    subtitles: { enabled: val("sEnabled").checked, languages: val("sLang").value },
    qbittorrent: { engine: document.querySelector("input[name=qEngine]:checked").value, enabled: val("qEnabled").checked, url: val("qUrl").value, username: val("qUser").value, password: val("qPass").value, save_path: val("qSave").value, upload_limit_kb: val("qUp").value },
    updates: { auto: val("updAuto").checked },
    tailnet: { enabled: val("tnOn").checked, mode: document.querySelector("input[name=tnMode]:checked").value, name: val("tnName").value, authkey: val("tnKey").value, helper_url: val("tnUrl").value },
    backup: { enabled: val("bkOn").checked, folder: val("bkFolder").value, keep: val("bkKeep").value, every_days: 7 },
    plex: { url: val("pUrl").value, token: val("pToken").value },
    system: { drives: val("drives").value.split(",").map(x => x.trim()).filter(Boolean) },
  };
  try {
    const r = await api("/api/settings", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    toast(`Saved. Music: ${r.music_in_use.length} folder(s), movies: ${r.movies_in_use.length} folder(s).`);
    $("#view").innerHTML = ""; render();
  } catch (e) { toast(e.message); }
}

let stopArmed = false;
async function control(action) {
  if (action === "stop" && !stopArmed) { stopArmed = true; val("stopBtn").textContent = "Tap again to stop"; setTimeout(() => { stopArmed = false; if (val("stopBtn")) val("stopBtn").textContent = "Stop"; }, 4000); return; }
  try { await api("/api/control/" + action, {method:"POST"}); } catch (e) { toast(e.message); return; }
  if (action === "stop") { $("#view").innerHTML = `<div class="empty">Server Assistant is stopped.<br>Start it again from the tray icon on the server or with start.bat.</div>`; $("#sub").innerHTML = ""; return; }
  toast("Restarting…");
  $("#view").innerHTML = `<div class="empty">Restarting…</div>`;
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try { await api("/api/status"); toast("Back up"); render(); return; } catch (e) {}
  }
  toast("Still not back. Check the server.");
}

/* subtitle sources */
let srcList = [], srcPresets = {}, srcOpen = null;
const TYPE_LABEL = {website: "Website", api: "API", opensubtitles: "API", subdl: "API"};
function srcFields(x, i) {
  const f = (k, label, ph = "", secret = false) => `<div class="field"><label class="l">${label}</label><input type="text" data-i="${i}" data-k="${k}" value="${esc(x[k] ?? "")}" placeholder="${esc(ph)}" autocomplete="off"${secret ? ' style="-webkit-text-security:disc"' : ""}></div>`;
  let h = f("name", "Name");
  if (x.type === "website") {
    if (x.base_url !== undefined) h += f("base_url", "Site address", "https://…");
    h += f("search_url", "Search address", "https://site.com/search?q={title}+{year}");
    h += `<label class="check"><input type="checkbox" data-i="${i}" data-k="needs_imdb" ${x.needs_imdb ? "checked" : ""}>Only search when the movie has an IMDb id</label>`;
    h += f("max_pages", "Pages to open per search", "8");
  } else if (x.type === "api") {
    h += f("search_url", "API search address", "https://api.site.com/subs?imdb={imdb}&lang={lang}&key=YOURKEY");
    h += `<div class="field"><label class="l">Extra headers (one per line, e.g. Api-Key: abc)</label><textarea data-i="${i}" data-k="headers" style="min-height:44px">${esc(x.headers || "")}</textarea></div>`;
  } else if (x.type === "opensubtitles") {
    h += f("api_key", "API key", "", true) + f("username", "Username") + f("password", "Password", "", true);
  } else if (x.type === "subdl") {
    h += f("api_key", "API key", "", true);
  }
  const note = x.preset && srcPresets[x.preset] ? `<div class="hint" style="margin-bottom:8px">${esc(srcPresets[x.preset].note)}</div>` : "";
  return note + h + `<div class="card" style="background:var(--bg);margin-top:6px"><div class="small-t" style="margin-bottom:6px">Test this source</div>
    <div class="grid2" style="grid-template-columns:2fr 1fr 1.4fr 0.8fr;gap:6px">
      <input type="text" id="tTitle${i}" value="Heat" placeholder="Title"><input type="text" id="tYear${i}" value="1995" placeholder="Year">
      <input type="text" id="tImdb${i}" value="tt0113277" placeholder="IMDb id"><input type="text" id="tLang${i}" value="fa" placeholder="Lang"></div>
    <div class="actions"><button class="small primary" type="button" onclick="testSource(${i})">Run test</button></div>
    <div id="tOut${i}" class="small-t"></div></div>`;
}
function renderSources() {
  const box = val("srcBox"); if (!box) return;
  box.innerHTML = srcList.map((x, i) => `<div class="card" style="padding:10px 12px">
    <div style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" data-i="${i}" data-k="enabled" ${x.enabled !== false ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)" title="On/off">
      <div class="grow" style="cursor:pointer" onclick="toggleSrc(${i})"><b>${esc(x.name || "New source")}</b> <span class="pill">${TYPE_LABEL[x.type] || x.type}</span>${x.enabled === false ? ' <span class="pill">off</span>' : ""}</div>
      <button class="small" type="button" onclick="moveSrc(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="small" type="button" onclick="moveSrc(${i},1)" ${i === srcList.length - 1 ? "disabled" : ""}>↓</button>
      <button class="small" type="button" onclick="toggleSrc(${i})">${srcOpen === i ? "Close" : "Edit"}</button>
      <button class="small danger" type="button" onclick="removeSrc(${i})">✕</button>
    </div>${srcOpen === i ? `<div style="margin-top:10px">${srcFields(x, i)}</div>` : ""}</div>`).join("") || `<div class="card muted">No sources. Add one below.</div>`;
  const used = new Set(srcList.map(x => x.preset).filter(Boolean));
  const free = Object.entries(srcPresets).filter(([k]) => !used.has(k));
  val("presetAdd").innerHTML = `<option value="">+ Add built-in…</option>` + free.map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join("");
  val("presetAdd").hidden = !free.length;
}
function collectSources() {
  document.querySelectorAll("#srcBox [data-k]").forEach(el => {
    const x = srcList[+el.dataset.i]; if (!x) return;
    x[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
  });
}
function toggleSrc(i) { collectSources(); srcOpen = srcOpen === i ? null : i; renderSources(); }
function moveSrc(i, d) { collectSources(); const j = i + d; [srcList[i], srcList[j]] = [srcList[j], srcList[i]]; if (srcOpen === i) srcOpen = j; else if (srcOpen === j) srcOpen = i; renderSources(); }
function removeSrc(i) { collectSources(); if (!confirmRemove(i)) return; srcList.splice(i, 1); srcOpen = null; renderSources(); }
let removeArmed = null;
function confirmRemove(i) { if (removeArmed === i) { removeArmed = null; return true; } removeArmed = i; toast("Tap ✕ again to remove " + (srcList[i].name || "this source")); setTimeout(() => removeArmed = null, 4000); return false; }
function addSource(type) {
  collectSources();
  srcList.push(type === "api" ? {type: "api", name: "My API", search_url: "", enabled: true} : {type: "website", name: "My website", search_url: "", max_pages: 8, enabled: true});
  srcOpen = srcList.length - 1; renderSources();
}
function addPreset(sel) {
  if (!sel.value) return; collectSources();
  srcList.push({...srcPresets[sel.value].config, preset: sel.value, enabled: true});
  srcOpen = srcList.length - 1; renderSources();
}
async function testSource(i) {
  collectSources();
  const out = val("tOut" + i); out.innerHTML = "Testing… (this can take up to a minute)";
  try {
    const r = await api("/api/subsources/test", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
      source: srcList[i], title: val("tTitle" + i).value, year: val("tYear" + i).value, imdb: val("tImdb" + i).value, lang: val("tLang" + i).value.trim() || "en"})});
    let h = r.ok ? `<div class="ok" style="margin-top:6px">✓ ${esc(r.ok)}</div>` + (r.sample ? `<div class="folderlist" style="margin-top:4px" dir="auto">${r.sample.map(esc).join("<br>")}</div>` : "")
                 : `<div class="fail" style="margin-top:6px">✗ ${esc(r.error || "No result")}</div>`;
    if (r.candidates.length) h += `<div style="margin-top:6px">Found ${r.candidates.length}:</div>` + r.candidates.slice(0, 5).map(c => `<div class="path">• ${esc(c.name)}</div>`).join("");
    h += `<details style="margin-top:6px"><summary>What it did</summary><div class="path">${r.trace.map(esc).join("<br>")}</div></details>`;
    out.innerHTML = h;
  } catch (e) { out.innerHTML = `<div class="fail">${esc(e.message)}</div>`; }
}

/* folder picker */
let pickTarget = null, pickSingle = false;
function openPicker(target, single = false) { pickTarget = target; pickSingle = single; browseTo(""); }
async function browseTo(path) {
  let d; try { d = await api("/api/browse?path=" + encodeURIComponent(path)); } catch (e) { toast(e.message); return; }
  const o = $("#picker"); o.hidden = false;
  o.innerHTML = `<div class="sheet"><div class="title" style="font-size:15px">Choose a folder on the server</div>
    <div class="meta" style="margin-top:4px">${d.path ? esc(d.path) : "Drives"}</div>
    <div class="items">${d.path ? `<button onclick='browseTo(${JSON.stringify(d.parent || "")})'>⬆ Up</button>` : ""}
      ${d.folders.map(f => `<button onclick='browseTo(${JSON.stringify(f)})'>📁 ${esc(d.path ? f.split(/[\\/]/).filter(Boolean).pop() : f)}</button>`).join("") || `<div class="muted" style="padding:10px">No subfolders</div>`}</div>
    <div class="actions" style="margin:0">${d.path ? `<button class="primary small" onclick='pickFolder(${JSON.stringify(d.path)})'>Use this folder</button>` : ""}
      <button class="small" onclick="$('#picker').hidden=true">Cancel</button></div></div>`;
}
function pickFolder(path) {
  const el = val(pickTarget);
  if (pickSingle || el.tagName === "INPUT") el.value = path;
  else { const lines = el.value.split("\n").map(x => x.trim()).filter(Boolean); if (!lines.includes(path)) lines.push(path); el.value = lines.join("\n"); }
  $("#picker").hidden = true;
}

/* ---------------- shell ---------------- */
let rendering = false;
let seq = 0, inflight = false;
const tabCache = {};
const setSub = (my, h) => { if (my === seq) $("#sub").innerHTML = h; };
const setView = (my, h) => { if (my === seq) $("#view").innerHTML = h; };
async function render() {
  const my = ++seq, myTab = tab; inflight = true;
  try {
    if (tab === "server") await renderServer();
    else if (tab === "music") await renderMusic();
    else if (tab === "downloads") await renderDownloads();
    else if (tab === "subs") await renderSubs();
    else await renderSettings();
    if (my !== seq) return;  // another tab was opened meanwhile
    tabCache[myTab] = { heading: $("#heading").textContent, sub: $("#sub").innerHTML, view: $("#view").innerHTML };
    const st = await api("/api/status"); const n = st.release_counts.new || 0;
    $("#newCount").hidden = !n; $("#newCount").textContent = n;
  } catch (e) { if (my === seq) $("#sub").innerHTML = `<span class="fail">Can't reach the server: ${esc(e.message)}</span>`; }
  if (my === seq) inflight = false;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { selectTab(b.dataset.tab); window.scrollTo(0, 0); render(); });
function selectTab(name) {
  tab = name; openAdd = null; confirmStop = null;
  const c = tabCache[name];  // show what we had last time straight away, then refresh behind it
  if (c && name !== "settings") { $("#heading").textContent = c.heading; $("#sub").innerHTML = c.sub; $("#view").innerHTML = c.view; }
  else { $("#heading").textContent = ({server:"Server", music:"Music", downloads:"Downloads", subs:"Subtitles", settings:"Settings"})[name]; $("#sub").textContent = ""; $("#view").innerHTML = `<div class="empty">Loading…</div>`; }
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === name));
  history.replaceState(null, "", "#" + name);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
if (window.Android) { $("#appGear").hidden = false; $("#appGear").onclick = () => Android.changeServer(); }
const start = location.hash.slice(1);
if (["server", "music", "downloads", "subs", "settings"].includes(start)) selectTab(start);
render();
setInterval(() => { if (inflight || (tab === "music" && openAdd) || tab === "settings") return; render(); }, 5000);
</script>
</body>
