<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Server Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f1115; color:#e8e8ea; font:16px system-ui, sans-serif; }
  .box { max-width:420px; padding:24px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; } p { color:#9aa0aa; margin:6px 0; }
  .bar { height:6px; background:#23262d; border-radius:3px; overflow:hidden; margin:16px 0; }
  .bar div { height:100%; width:0; background:#f5b301; transition:width .2s; }
  input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #333; background:#1a1d23; color:inherit; }
  button { background:#f5b301; color:#111; border:0; font-weight:600; cursor:pointer; }
</style></head><body><div class="box">
  <h1>Looking for your Server Assistant…</h1>
  <p id="msg">Checking the usual addresses</p>
  <div class="bar"><div id="prog"></div></div>
  <div id="fail" hidden>
    <p>Couldn't find it. Is the server PC on and Server Assistant running?</p>
    <p><button onclick="location.reload()">Try again</button></p>
    <p style="margin-top:16px">Or type its address:</p>
    <p><input id="manual" placeholder="192.168.1.13" size="18"> <button onclick="manual()">Open</button></p>
  </div>
</div>
<script>
const PORT = __PORT__;
const KNOWN_IP = "__IP__";
const HOSTS = ["__HOST__", "serverassistant.local"].filter(h => h && !h.startsWith("__"));
const $ = id => document.getElementById(id);
const get = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

async function ping(host, ms = 1500) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(`http://${host}:${PORT}/api/ping`, { signal: ctl.signal, cache: "no-store" });
    const j = await r.json();
    return j && j.app === "server-assistant";
  } catch (e) { return false; } finally { clearTimeout(t); }
}
function go(host) { put("last", host); location.replace(`http://${host}:${PORT}/`); }
function manual() { const v = $("manual").value.trim(); if (v) go(v); }

(async function () {
  // 1. the addresses that normally work
  const first = [get("last"), ...HOSTS, KNOWN_IP].filter((h, i, a) => h && !h.startsWith("__") && a.indexOf(h) === i);
  for (const h of first) { $("msg").textContent = "Trying " + h; if (await ping(h)) return go(h); }
  // 2. scan the home network (same first three numbers as the last known address)
  const bases = [...new Set([get("last"), KNOWN_IP].filter(x => /^\d+\.\d+\.\d+\.\d+$/.test(x)).map(x => x.split(".").slice(0, 3).join(".")))];
  if (!bases.length) bases.push("192.168.1");
  for (const base of bases) {
    $("msg").textContent = "Searching your network (" + base + ".x)…";
    const ips = Array.from({ length: 254 }, (_, i) => `${base}.${i + 1}`);
    let found = null, done = 0;
    for (let i = 0; i < ips.length && !found; i += 32) {
      await Promise.all(ips.slice(i, i + 32).map(async ip => { if (!found && await ping(ip, 900)) found = ip; done++; $("prog").style.width = (done / 254 * 100) + "%"; }));
    }
    if (found) return go(found);
  }
  $("msg").textContent = ""; $("fail").hidden = false;
})();
</script></body></html>
